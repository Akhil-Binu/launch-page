<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaunchPad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="flex items-center justify-center min-h-screen p-4 overflow-hidden">
  <div class="bg-mesh"></div>

  <!-- Ambient Starfield & Mouse Nebula Canvas -->
  <canvas id="ambientCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Fullscreen Wide Fireworks Canvas -->
  <canvas id="fireworksCanvas" class="fixed inset-0 pointer-events-none z-[60]"></canvas>

  <!-- ── Top Header Navigation Bar ───────────────────── -->
  <header class="fixed top-0 left-0 right-0 z-40 px-4 sm:px-8 pt-5 pb-3 flex items-center justify-between select-none pointer-events-none gap-3">
    <!-- Top-Left: System Status HUD -->
    <div class="pointer-events-auto flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-white/[.04] border border-white/[.07] backdrop-blur-md shadow-sm shrink-0">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
      </span>
      <span class="text-[10px] font-mono tracking-widest text-slate-300 uppercase">SYS_READY</span>
      <span class="hidden sm:inline text-[9px] font-mono text-slate-500 border-l border-white/10 pl-2">24ms</span>
    </div>

    <!-- Top-Center: Main Heading (100% Fully Visible, Never Truncated) -->
    <div class="pointer-events-auto flex items-center justify-center min-w-0">
      <div class="px-5 sm:px-6 py-2 rounded-full bg-slate-900/70 border border-white/[.1] backdrop-blur-xl shadow-xl shadow-indigo-500/10 flex items-center gap-3">
        <span class="w-2 h-2 rounded-full bg-indigo-400 shadow-[0_0_10px_#818cf8] shrink-0"></span>
        <h1 id="pageHeading" class="heading-font text-xs sm:text-sm md:text-base font-extrabold tracking-[0.18em] uppercase bg-gradient-to-r from-white via-indigo-100 to-indigo-300 bg-clip-text text-transparent drop-shadow-[0_0_16px_rgba(99,102,241,0.5)] whitespace-nowrap text-center transition-all duration-300">
          ORBITAL LAUNCHPAD // V2.0
        </h1>
        <span class="w-2 h-2 rounded-full bg-indigo-400 shadow-[0_0_10px_#818cf8] shrink-0"></span>
      </div>
    </div>

    <!-- Top-Right: Mode HUD Badge (opens settings) -->
    <button id="modeBadge" class="pointer-events-auto flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/[.04] border border-white/[.07] backdrop-blur-md text-[10px] font-mono tracking-wider text-slate-300 hover:border-indigo-500/40 hover:bg-white/[.08] transition cursor-pointer shrink-0 group" title="Current launch mode (click to configure)">
      <span class="text-indigo-400">MODE:</span>
      <span id="currentModeLabel" class="text-white font-semibold group-hover:text-indigo-300 transition">NEW TAB</span>
    </button>
  </header>

  <!-- ── Bottom-Left: Audio FX Toggle ───────────────── -->
  <button id="audioToggleBtn" class="fixed bottom-6 left-6 z-40 flex items-center gap-2.5 px-3.5 py-2 rounded-full bg-white/[.04] border border-white/[.07] backdrop-blur-md text-slate-400 hover:text-white hover:bg-white/[.08] transition cursor-pointer select-none group" title="Toggle audio feedback">
    <div id="soundBars" class="flex items-end gap-[2px] h-3.5 text-indigo-400">
      <span class="sound-bar"></span>
      <span class="sound-bar"></span>
      <span class="sound-bar"></span>
      <span class="sound-bar"></span>
    </div>
    <span id="audioLabel" class="text-[10px] font-mono tracking-widest uppercase text-slate-300">AUDIO ON</span>
  </button>

  <!-- ══════════════ MAIN VIEW — LAUNCH ONLY ══════════════ -->
  <main class="relative z-10 flex flex-col items-center gap-10 select-none">

    <!-- ── Second Heading / Subtitle ───────────────────── -->
    <div id="subheadingContainer" class="text-center space-y-1 select-none max-w-[85vw]">
      <p id="pageSubheading" class="text-xs sm:text-sm font-mono font-medium tracking-[0.25em] uppercase text-indigo-300/80 drop-shadow-[0_0_8px_rgba(99,102,241,0.4)] transition-all duration-300">
        INITIATE LAUNCH SEQUENCE
      </p>
    </div>

    <!-- ── Center Orbital Reticle + Button ────────────── -->
    <div class="relative flex items-center justify-center">
      <!-- Outer rotating dashed orbital ring with satellite beacon -->
      <div class="orbital-ring-outer">
        <div class="orbital-satellite"></div>
      </div>
      <!-- Inner counter-rotating dotted telemetry ring -->
      <div class="orbital-ring-inner"></div>

      <!-- ── THE Button ──────────────────────────────────── -->
      <button id="launchBtn" class="launch-btn group relative inline-flex items-center justify-center w-48 h-48 rounded-full text-white focus:outline-none cursor-pointer">
        <!-- Outer glow ring -->
        <span class="glow-ring"></span>
        <!-- Shimmering diagonal glass glare sweep -->
        <span class="btn-shimmer"></span>
        <!-- Gradient fill -->
        <span class="absolute inset-0 z-[1] rounded-full bg-gradient-to-br from-indigo-500 via-purple-600 to-indigo-600 shadow-2xl shadow-indigo-500/35"></span>
        <!-- Pulsing ambient ring -->
        <span class="absolute inset-0 z-0 rounded-full bg-gradient-to-br from-indigo-500/40 to-purple-500/40 animate-ping-slow"></span>
        <!-- Icon + label -->
        <span class="relative z-10 flex flex-col items-center gap-2 pointer-events-none">
          <svg class="w-11 h-11 transition-transform duration-300 group-hover:scale-110 drop-shadow-lg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 01-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 006.16-12.12A14.98 14.98 0 009.63 8.37m5.96 6a14.926 14.926 0 01-5.84 2.58m0 0a6 6 0 01-7.38-5.84h4.8m2.58-5.84a14.927 14.927 0 00-2.58 5.84m2.58-5.84L9.63 8.37" />
          </svg>
          <span class="text-sm font-bold uppercase tracking-[0.2em] drop-shadow">Launch</span>
        </span>
      </button>
    </div>

    <!-- Current target glass HUD card (click to edit in settings) -->
    <div id="targetCard" class="flex items-center gap-2.5 px-4 py-2 rounded-full bg-white/[.03] border border-white/[.07] backdrop-blur-md text-xs text-slate-300 shadow-xl shadow-indigo-500/5 group hover:border-indigo-500/40 hover:bg-white/[.06] transition cursor-pointer select-none" title="Destination URL (click to edit in settings)">
      <span class="text-[9px] font-mono font-bold tracking-wider uppercase px-1.5 py-0.5 rounded bg-indigo-500/15 text-indigo-300 border border-indigo-500/25">HTTPS</span>
      <span id="targetHint" class="text-xs font-mono text-slate-300 truncate max-w-[220px]">example.com</span>
      <svg class="w-3.5 h-3.5 text-slate-500 group-hover:text-indigo-400 group-hover:translate-x-0.5 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-6 0l7.5-7.5M15 3h6v6" /></svg>
    </div>

    <!-- ── Settings gear (bottom-right fixed) ──────────── -->
    <button id="settingsBtn" class="fixed bottom-6 right-6 w-11 h-11 rounded-full bg-white/[.06] border border-white/[.08] backdrop-blur-md flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/[.1] transition-all duration-300 cursor-pointer z-40 group">
      <svg class="w-5 h-5 transition-transform duration-500 group-hover:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </button>
  </main>

  <!-- ══════════════ PARABOLIC COUNTDOWN OVERLAY ══════════════ -->
  <div id="countdownOverlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-md px-4">
    <div class="text-center w-full max-w-md flex flex-col items-center space-y-6">

      <!-- Parabolic Trajectory Display -->
      <div class="relative w-full max-w-[390px] aspect-[2/1] flex items-center justify-center select-none">
        <svg class="w-full h-full overflow-visible" viewBox="0 0 400 200">
          <defs>
            <!-- Glowing Parabolic Gradient -->
            <linearGradient id="parabolaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#6366f1" />
              <stop offset="35%" stop-color="#a855f7" />
              <stop offset="65%" stop-color="#ec4899" />
              <stop offset="100%" stop-color="#38bdf8" />
            </linearGradient>

            <!-- Glow Filter -->
            <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Trajectory Grid Axis & Apogee line -->
          <line x1="40" y1="160" x2="360" y2="160" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
          <line x1="200" y1="75" x2="200" y2="160" stroke="#6366f1" stroke-width="1" stroke-dasharray="2,3" opacity="0.3" />
          <circle cx="200" cy="75" r="3" fill="#a855f7" opacity="0.6" />
          <text x="200" y="65" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="monospace" letter-spacing="1">APOGEE</text>

          <!-- Launch & Destination Pad Markers -->
          <circle cx="40" cy="160" r="5" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
          <circle cx="360" cy="160" r="5" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
          <text x="40" y="178" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">ORIGIN</text>
          <text x="360" y="178" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">TARGET</text>

          <!-- Background Parabolic Track -->
          <path d="M 40,160 Q 200,-10 360,160" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
          <path d="M 40,160 Q 200,-10 360,160" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

          <!-- Active Parabolic Trajectory Arc (animated) -->
          <path id="countdownParabola" d="M 40,160 Q 200,-10 360,160" fill="none" stroke="url(#parabolaGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glowEffect)" />

          <!-- Tracer Rocket / Orb along the Parabola -->
          <g id="parabolaTracer" transform="translate(40, 160)">
            <!-- Outer pulse halo -->
            <circle cx="0" cy="0" r="10" fill="#a855f7" opacity="0.3" class="animate-ping-slow" />
            <!-- Inner glowing projectile -->
            <circle cx="0" cy="0" r="5" fill="#ffffff" filter="url(#glowEffect)" />
            <!-- Core spark -->
            <circle cx="0" cy="0" r="2.5" fill="#facc15" />
          </g>
        </svg>

        <!-- Centered Countdown Telemetry (under the parabolic arch) -->
        <div class="absolute inset-0 flex flex-col items-center justify-center pt-8 pointer-events-none">
          <span id="countdownTelemetry" class="text-[11px] font-mono tracking-[0.25em] text-indigo-400 font-semibold mb-1">T-MINUS 03s</span>
          <span id="countdownNum" class="text-6xl font-black text-white tracking-tight drop-shadow-2xl">3</span>
          <span id="telemetryStatus" class="text-[11px] font-mono tracking-widest text-slate-400 mt-2">TRAJECTORY LOCKED</span>
        </div>
      </div>

      <!-- Controls -->
      <button id="cancelCountdown" class="px-6 py-2.5 rounded-full bg-white/[.06] border border-white/[.08] text-slate-300 text-sm font-medium hover:bg-white/[.1] hover:text-white transition cursor-pointer">
        Abort Launch
      </button>
    </div>
  </div>

  <!-- ══════════════ SETTINGS DRAWER ══════════════ -->
  <!-- Backdrop -->
  <div id="settingsBackdrop" class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <!-- Drawer panel -->
  <div id="settingsDrawer" class="fixed bottom-0 left-0 right-0 z-50">
    <div class="max-w-lg mx-auto">
      <!-- Drag handle -->
      <div class="flex justify-center pt-3 pb-1 cursor-grab" id="drawerHandle">
        <div class="w-10 h-1 rounded-full bg-slate-600"></div>
      </div>
      <div class="bg-slate-900 border-t border-white/[.08] rounded-t-2xl px-6 pb-8 pt-4 space-y-6 max-h-[80vh] overflow-y-auto">

        <!-- Drawer header -->
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold text-white tracking-tight">Settings</h2>
          <button id="closeDrawer" class="w-8 h-8 rounded-full bg-white/[.06] flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/[.1] transition cursor-pointer">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>

        <!-- ── Target URL ────────────────────────────── -->
        <div class="space-y-2">
          <label class="text-xs font-semibold uppercase tracking-widest text-slate-500">Target URL</label>
          <div class="flex gap-2">
            <input id="urlInput" type="text" placeholder="https://example.com" spellcheck="false"
              class="flex-1 rounded-xl border border-white/10 bg-slate-800/60 px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/30 transition" />
            <button id="setUrlBtn" class="shrink-0 px-5 py-3 rounded-xl bg-indigo-500/20 text-indigo-300 text-sm font-semibold hover:bg-indigo-500/30 transition cursor-pointer">Set</button>
          </div>
          <p id="urlHint" class="text-xs text-slate-500 h-4"></p>
        </div>

        <!-- ── Primary Heading ───────────────────────── -->
        <div class="space-y-2">
          <label class="text-xs font-semibold uppercase tracking-widest text-slate-500">Primary Heading (Top Bar)</label>
          <div class="flex gap-2">
            <input id="headingInput" type="text" placeholder="ORBITAL LAUNCHPAD // V2.0" spellcheck="false" maxlength="40"
              class="flex-1 rounded-xl border border-white/10 bg-slate-800/60 px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/30 transition font-mono" />
            <button id="setHeadingBtn" class="shrink-0 px-5 py-3 rounded-xl bg-indigo-500/20 text-indigo-300 text-sm font-semibold hover:bg-indigo-500/30 transition cursor-pointer">Set</button>
          </div>
          <p id="headingHint" class="text-xs text-slate-500 h-4"></p>
        </div>

        <!-- ── Second Heading ────────────────────────── -->
        <div class="space-y-2">
          <label class="text-xs font-semibold uppercase tracking-widest text-slate-500">Second Heading (Above Launcher)</label>
          <div class="flex gap-2">
            <input id="subheadingInput" type="text" placeholder="INITIATE LAUNCH SEQUENCE" spellcheck="false" maxlength="50"
              class="flex-1 rounded-xl border border-white/10 bg-slate-800/60 px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/30 transition font-mono" />
            <button id="setSubheadingBtn" class="shrink-0 px-5 py-3 rounded-xl bg-indigo-500/20 text-indigo-300 text-sm font-semibold hover:bg-indigo-500/30 transition cursor-pointer">Set</button>
          </div>
          <p id="subheadingHint" class="text-xs text-slate-500 h-4"></p>
        </div>

        <!-- ── Open Mode ─────────────────────────────── -->
        <div class="space-y-3">
          <label class="text-xs font-semibold uppercase tracking-widest text-slate-500">Open Mode</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="mode-card flex flex-col items-center gap-1.5 p-3 rounded-xl border border-white/[.06] bg-white/[.03] cursor-pointer transition hover:bg-white/[.06] has-[:checked]:border-indigo-500/50 has-[:checked]:bg-indigo-500/10">
              <input type="radio" name="mode" value="newtab" checked class="sr-only" />
              <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-6 0l7.5-7.5M15 3h6v6" />
              </svg>
              <span class="text-xs text-slate-300 font-medium">New Tab</span>
            </label>
            <label class="mode-card flex flex-col items-center gap-1.5 p-3 rounded-xl border border-white/[.06] bg-white/[.03] cursor-pointer transition hover:bg-white/[.06] has-[:checked]:border-indigo-500/50 has-[:checked]:bg-indigo-500/10">
              <input type="radio" name="mode" value="same" class="sr-only" />
              <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8.25V18a2.25 2.25 0 002.25 2.25h13.5A2.25 2.25 0 0021 18V8.25m-18 0V6a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 6v2.25m-18 0h18" />
              </svg>
              <span class="text-xs text-slate-300 font-medium">Same</span>
            </label>
            <label class="mode-card flex flex-col items-center gap-1.5 p-3 rounded-xl border border-white/[.06] bg-white/[.03] cursor-pointer transition hover:bg-white/[.06] has-[:checked]:border-indigo-500/50 has-[:checked]:bg-indigo-500/10">
              <input type="radio" name="mode" value="popup" class="sr-only" />
              <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8.25V18a2.25 2.25 0 002.25 2.25h6V12h8.25V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v2.25z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 13.5h7.5v6h-7.5z" />
              </svg>
              <span class="text-xs text-slate-300 font-medium">Popup</span>
            </label>
          </div>
        </div>

        <!-- ── Toggles ───────────────────────────────── -->
        <div class="space-y-3">
          <label class="text-xs font-semibold uppercase tracking-widest text-slate-500">Preferences</label>
          <div class="flex items-center justify-between py-1">
            <span class="text-sm text-slate-300">Launch Countdown</span>
            <div id="countdownToggle" class="toggle-track" role="switch" aria-checked="false" tabindex="0">
              <div class="toggle-thumb"></div>
            </div>
          </div>
          <!-- Duration picker (visible when countdown is enabled) -->
          <div id="durationPicker" class="hidden pl-1 pt-1">
            <div class="flex gap-2">
              <label class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-xl border border-white/[.06] bg-white/[.03] cursor-pointer transition hover:bg-white/[.06] has-[:checked]:border-indigo-500/50 has-[:checked]:bg-indigo-500/10">
                <input type="radio" name="countdown-duration" value="3" checked class="sr-only" />
                <span class="text-sm text-slate-300 font-medium">3s</span>
              </label>
              <label class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-xl border border-white/[.06] bg-white/[.03] cursor-pointer transition hover:bg-white/[.06] has-[:checked]:border-indigo-500/50 has-[:checked]:bg-indigo-500/10">
                <input type="radio" name="countdown-duration" value="5" class="sr-only" />
                <span class="text-sm text-slate-300 font-medium">5s</span>
              </label>
              <label class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-xl border border-white/[.06] bg-white/[.03] cursor-pointer transition hover:bg-white/[.06] has-[:checked]:border-indigo-500/50 has-[:checked]:bg-indigo-500/10">
                <input type="radio" name="countdown-duration" value="10" class="sr-only" />
                <span class="text-sm text-slate-300 font-medium">10s</span>
              </label>
            </div>
          </div>
        </div>

        <!-- ── Recent Launches ───────────────────────── -->
        <div id="recentSection" class="hidden space-y-3">
          <label class="text-xs font-semibold uppercase tracking-widest text-slate-500">Recent Launches</label>
          <div id="recentChips" class="flex flex-wrap gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════ POPUP-BLOCKED TOAST ══════════════ -->
  <div id="popupAlert" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 hidden">
